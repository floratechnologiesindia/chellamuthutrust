# MSC Trust CRM — api / app / donor portals
# Proxies to msctrustcrm Docker stack (127.0.0.1:3001 API, 127.0.0.1:8081 web)

map $http_upgrade $msctrust_connection_upgrade {
    default upgrade;
    ''      close;
}

# ── API ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.msctrustcrm.com;
    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $msctrust_connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# ── Staff admin panel ────────────────────────────────────────
server {
    listen 80;
    server_name app.msctrustcrm.com;
    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── Donor portal ─────────────────────────────────────────────
server {
    listen 80;
    server_name donor.msctrustcrm.com;
    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
